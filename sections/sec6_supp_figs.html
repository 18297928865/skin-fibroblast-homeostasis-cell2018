<section id="sec-supp-figs" class="paper-section">
  <h2>补充图表（SUPPLEMENTAL FIGURES）</h2>

  <figure class="paper-figure" id="fig-S1">
    <img src="images/figS1.png" alt="Figure S1" class="zoomable" loading="lazy">
    <figcaption>
      <strong>Figure S1. 活体成像捕捉到皮肤真皮的解剖学细节，与 Figure 1 相关（Anatomical Details of Skin Dermis Are Captured by Live Imaging, Related to Figure 1）</strong><br>
      <strong>(A)</strong> 无毛足底皮肤冰冻切片的代表性 H&amp;E 染色（左图）与标记了 <code>PDGFRα-H2BGFP</code> 和 <code>mTmG</code> 等位基因及二次谐波信号（SHG）的活体成像小鼠足底的代表性 Z 投影（约 0.5 μm 厚，右图）的并排比较。图中标注了表皮（Epidermis）、真皮（dermis）及其下方的骨骼肌（skeletal muscle）。二次谐波信号是某些分子在双光子光源激发下无需任何外源标记而产生的波长为入射光一半的光信号。通常，结构分子（例如胶原蛋白）发射这种光，在我们的成像条件下于蓝色通道中捕获。比例尺，20 μm。<br>
      <strong>(B)</strong> 来自 Video S1 的帧图，该视频为 <code>PDGFRα-H2BGFP; mTmG</code> 活体小鼠足底真皮的活体成像 Z 轴堆栈。表皮细胞（第 1 列）明显被 membrane-tdTomato 标记。毛细血管（用作地标）在上层真皮中可见（第 2 列），同时可见绿色成纤维细胞核（<code>PDGFRα-H2BGFP</code>）和胶原蛋白（上述二次谐波信号）。较粗的血管在下层真皮中可见（第 3 列）。骨骼肌层在第 4 列中可见。虽然 <code>mTmG</code>（未重组形式为 membrane-tdTomato）标记所有细胞，但某些细胞特别容易检测到，例如表皮、血管和肌肉。成纤维细胞的 membrane-tdTomato 虽然可见，但难以与邻近细胞区分（第 2 行第 2、3 列）。因此，在后续图像中我们通常仅展示成纤维细胞特异性重组后的膜-GFP（membrane-GFP）。比例尺，50 μm；插图比例尺，20 μm。<br>
      <strong>(C)</strong> 图像相关系数分析的不同可能结果示例（正相关 +1.0：红绿通道相同；无相关 0.0：红绿通道一半时间相同；负相关 −1.0：红绿通道相反）。
    </figcaption>
  </figure>

  <figure class="paper-figure" id="fig-S2">
    <img src="images/figS2.png" alt="Figure S2" class="zoomable" loading="lazy">
    <figcaption>
      <strong>Figure S2. mTmG 与 Rac1 的 Cre-lox 重组可被监测，与 Figure 2 相关（Cre-lox Recombination of mTmG and Rac1 Can Be Monitored, Related to Figure 2）</strong><br>
      <strong>(A)</strong> 与 <a href="#fig-2" class="fig-ref">Figure 2A</a>（上行）完全相同的图像，但同时显示绿色（membrane-GFP）和红色（membrane-tdTomato）通道（<code>PDGFRα-CreER; R26-loxP-membraneTomato-STOP-membraneGFP (mTmG)</code>）。membrane-tdTomato 标记的可检测性较低且由所有细胞表达，因此我们通常仅呈现 <code>mTmG</code> 构建体中成纤维细胞特异性的 membrane-GFP 标记。此外，我们发现 membrane-GFP 的灰度投影能够更好地呈现细胞膜的精细细节。比例尺，20 μm。<br>
      <strong>(B)</strong> 在 <code>PDGFRα-H2BGFP; PDGFRα-CreER; mTmG</code> 小鼠经最大剂量他莫昔芬诱导（3 次 60 mg/kg 体重）后，剩余的 <code>PDGFRα-H2BGFP</code> 阳性、membrane-GFP 阴性细胞数量的定量。y 轴表示每 100 个成纤维细胞中未被膜标记的成纤维细胞数。平均重组率占总成纤维细胞（<code>PDGFRα-H2BGFP</code>）的 98.2% ± 1.0%。<code>PDGFRα-H2BGFP</code> 标记皮肤中的所有成纤维细胞。n = 3 只小鼠。<br>
      <strong>(C)</strong> 代表性基因分型凝胶图，使用针对 <code>Rac1<sup>−</sup></code>（左侧 8 道）和 <code>Rac1<sup>fl</sup></code>（右侧 8 道）的特异性 DNA 引物，展示未重组与重组（+tam）<em>Rac1</em> 小鼠。通过在 6 天内给予 3 次 60 mg/kg 体重他莫昔芬诱导等位基因重组。引物 PO33 和 PO91 用于检测 <code>Rac1<sup>wt</sup></code>（115 bp）和 <code>Rac1<sup>fl</sup></code>（242 bp）（右侧 8 道）。引物 PO33 和 PO45 用于检测 <code>Rac1<sup>−</sup></code>（150 bp / 图中标 140 bp）的存在（左侧 8 道）（Huang et al., 2011）。<br>
      <strong>(D)</strong> 与 <a href="#fig-2" class="fig-ref">Figures 2E and 2G</a> 使用的完全相同的数据集，但按每个生物学重复分列展示，以显示 <code>Rac1+/−</code> 和 <code>Rac1−/−</code> 之间稳态膜覆盖率的变异。每一列（例如“g267m1”）代表一只独立的小鼠。每个圆点代表该小鼠内的一个独立采样区域。每只小鼠的样本取平均值后呈现于 <a href="#fig-2" class="fig-ref">Figure 2G</a>。
    </figcaption>
  </figure>

  <figure class="paper-figure" id="fig-S3">
    <img src="images/figS3.png" alt="Figure S3" class="zoomable" loading="lazy">
    <figcaption>
      <strong>Figure S3. 消融后追踪成纤维细胞膜，与 Figure 3 相关（Tracking Fibroblast Membranes after Ablation, Related to Figure 3）</strong><br>
      <strong>(A)</strong> 激光细胞消融后的代表性时间进程，表明细胞消融后细胞膜不会残留。图示为单个膜-GFP 标记的成纤维细胞在消融前和消融后即刻的状态。在 +1 天重访时，细胞核和细胞膜均不再存在，提示激光消融 1 天后不会残留带标记的细胞碎片（debris）。比例尺，10 μm。<br>
      <strong>(B)</strong> 与 <a href="#fig-3" class="fig-ref">Figure 3B</a> 使用的完全相同的图像，但提高了亮度以展示消融前原始细胞膜与消融后 +2 周新占据细胞膜的位置。尽管新的细胞膜以相似的程度占据该区域，但它并不占据该区域内完全相同的位置，因为右侧的合并图（merge）显示出若干仅呈绿色或仅呈红色的区域。比例尺，20 μm。
    </figcaption>
  </figure>

  <figure class="paper-figure" id="fig-S4">
    <img src="images/figS4.png" alt="Figure S4" class="zoomable" loading="lazy">
    <figcaption>
      <strong>Figure S4. 垂直成纤维细胞膜延伸指向表皮，与 Figure 4 相关（Vertical Fibroblast Membrane Extensions Extend toward to Epidermis, Related to Figure 4）</strong><br>
      <strong>(A)</strong> 足底真皮的代表性冰冻切片，其中成纤维细胞核被标记（<code>PDGFRα-H2BGFP</code>），胶原蛋白通过二次谐波信号（SHG）以蓝色显示。成纤维细胞被分为两组（上层成纤维细胞与下层成纤维细胞），以检验上层成纤维细胞核 H2BGFP 信号的平均亮度是否更高。比例尺，30 μm。代表 n = 4 只小鼠的结果。<br>
      <strong>(B)</strong> 消融后 +2 周时，结合核标记拍摄的垂直膜延伸单张图像。表皮与成纤维细胞核之间可见细胞缺失空间。在此空间内，隐约可见两条膜延伸（箭头/arrowheads）。由于 H2BGFP 远亮于 membrane-GFP，且 Z 轴分辨率低于 XY 平面，因此在与 H2BGFP 联用时较难观察到 membrane-GFP 延伸。比例尺，10 μm。<br>
      <strong>(C)</strong> 他莫昔芬诱导后 +6 周的单个 Z 轴堆栈代表性图像。垂直膜延伸在表皮下区域表现为纤细的膜“孤岛（islands）”。完整的细胞体在 20 μm 深度处可见。比例尺，20 μm。<br>
      <strong>(D)</strong> 展示上层真皮激光消融后来自下方细胞的垂直膜突起的代表性图像。图示为激光消融前（第 1 行）及消融后 +1 周（第 2 行）的 Z 轴堆栈投影。最左侧为表皮（0 μm 深度），向右逐渐加深。激光消融前未见 membrane-GFP 标记的垂直突起（第 1 行），但在 +1 周时可见一条新的垂直突起，由橙色箭头高亮标出（第 2 行）。第 3 行为 XZ 投影，上方为表皮（Epi.），下方为上层真皮，分别对应上方第 1 行和第 2 行的同一区域在消融前（左图）和 +1 周（右图）的状态。同一条新的垂直突起以橙色箭头标出。比例尺，10 μm。
    </figcaption>
  </figure>

  <figure class="paper-figure" id="fig-S5">
    <img src="images/figS5.png" alt="Figure S5" class="zoomable" loading="lazy">
    <figcaption>
      <strong>Figure S5. 成纤维细胞密度在不同组织间存在差异，而膜占据率相似，与 Figure 5 相关（Fibroblast Density Varies across Tissues while Membrane Occupancy Is Similar, Related to Figure 5）</strong><br>
      <strong>(A)</strong> 足底（第 1 列）、耳尖（第 2 列）和耳根（第 3 列）中通过细胞核（<code>PDGFRα-H2BGFP</code>）和膜-GFP 标记的成纤维细胞代表性图像。尽管耳部与足底的细胞核密度不同，但该区域的膜占据率相似。比例尺，50 μm。<br>
      <strong>(B)</strong> 来自耳部（左）和足底（右）的成纤维细胞代表性图像，便于比较形态学差异。耳部成纤维细胞体积更大，且似乎比足底成纤维细胞具有更少的精细突起。比例尺 = 20 μm。<br>
      <strong>(C)</strong> 耳尖、耳根和足底成纤维细胞密度的定量。耳部（耳尖与耳根）成纤维细胞的密度低于足底，且这些成纤维细胞体积更大 (B)。每个区域 n = 3 只小鼠。<br>
      <strong>(D)</strong> 重塑有毛皮肤中，在激光消融粉色标记的细胞核（消融前）后，核与膜-GFP 标记成纤维细胞（<code>PDGFRα-H2BGFP; PDGFRα-CreER; mTmG</code>）的代表性时间进程。消融后 1 天（+1 day），橙色箭头标出了一些新的膜延伸。消融后 1 周（+1 week），观察到广泛的膜动态变化（橙色箭头标出）。在这种重塑有毛皮肤中，成纤维细胞核的位置也不稳定，+1 天与 +1 周之间细胞核不再处于相同位置，被消融区域似乎被细胞核和细胞膜重新定植。比例尺，50 μm。
    </figcaption>
  </figure>

  <figure class="paper-figure" id="fig-S6">
    <img src="images/figS6.png" alt="Figure S6" class="zoomable" loading="lazy">
    <figcaption>
      <strong>Figure S6. 非重塑有毛皮肤衰老过程中成纤维细胞核排布出现空隙，与 Figure 6 相关（Gaps in Fibroblast Nuclei Organization Appear during Aging in Non-remodeling Hairy Skin, Related to Figure 6）</strong><br>
      <strong>(A)</strong> 2 月龄（左）和 19 月龄（右）非重塑有毛皮肤中成纤维细胞（<code>PDGFRα-H2BGFP</code>）的代表性图像。毛囊位置以“HF”及一个直径近似该 Z 切片中毛囊直径的圆圈标出。可见 19 月龄小鼠中密度降低，且密度降低并非在整个组织中均匀发生，而是以局部成纤维细胞丢失簇的形式出现，与足底皮肤相似（<a href="#fig-6" class="fig-ref">Figure 6A</a>）。比例尺，50 μm。n = 3 只小鼠。<br>
      <strong>(B)</strong> 在非重塑有毛皮肤上层真皮 1000 μm × 1000 μm × 10 μm 区域中采样、Voronoi 分析中细胞面积超过 900 μm<sup>2</sup> 的数量。n = 4（2 月龄）；n = 4（16 月龄及以上）。p = 0.0024（2 月龄对比 ≥16 月龄）。误差线为标准差（std. dev.）。<br>
      <strong>(C)</strong> 在非重塑有毛皮肤上层真皮 1000 μm × 1000 μm × 10 μm 区域中采样的细胞密度。n = 4（2 月龄）；n = 4（16 月龄及以上）。p = 0.0004（2 月龄对比 ≥16 月龄）。误差线为标准差（std. dev.）。<br>
      <strong>(D)</strong> 非重塑有毛皮肤中成纤维细胞膜的两个代表性示例（上和下）。比例尺，50 μm；右图插图比例尺，50 μm。n = 4。<br>
      <strong>(E)</strong> 同一批小鼠相同区域在 5 个月期间非黄色细胞数量的定量。对应代表性时间进程见 <a href="#fig-6" class="fig-ref">Figure 6D</a>。纯红色细胞表示细胞丢失（左柱），纯绿色细胞表示细胞增加（右柱）。样本采自 3 只重访小鼠中面积介于 200 μm<sup>2</sup> 至 2800 μm<sup>2</sup> 不等的区域。细胞丢失远超细胞增加。误差线表示一个标准差。n = 3 只小鼠。
    </figcaption>
  </figure>
